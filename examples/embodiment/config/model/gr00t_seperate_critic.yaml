model_type: "gr00t"

# Model path - should be set in specific config files
model_path: "/path/to/model"

# Model precision and loading settings
precision: "bf16"
trust_remote_code: True
is_lora: false

# Action and policy settings
action_dim: 7
num_action_chunks: 5
denoising_steps: 4
policy_setup: "widowx_bridge"

# Observation and embodiment settings
obs_converter_type: "libero"
embodiment_tag: "libero_franka"
add_value_head: True

# RL head configuration
rl_head_config:
  joint_logprob: False
  noise_method: "flow_sde"
  ignore_last: False
  safe_get_logprob: False
  noise_anneal: False
  noise_params: [0.7, 0.3, 400]
  noise_level: 0.5
  add_value_head: ${actor.model.add_value_head}
  chunk_critic_input: False
  detach_critic_input: True
  disable_dropout: True
  use_vlm_value: True
  value_vlm_mode: "mean_token"
  padding_value: 570
  critic_type: "siggemma_server"
  critic_server_url: "http://gpu-25-n001:8002/act"
  critic_request_timeout: 120.0
  critic_image_mode: "concat_libero"
  critic_module_path: "/bigwork/nhkbwenn/vlm/models/sig_gemma_vlm.py"
  critic_class_name: "SigGemmaVLM"
  critic_ckpt_path: "/bigwork/nhkbwenn/vlm/model_checkpoints/SigGemmaVLM/libero/Last_Model_step_0006837_loss_0_0406_concat_images.pt"
  critic_siglip_ckpt: "google/siglip-so400m-patch14-384"
  critic_llm_id: "google/gemma-2-9b-it"
  critic_precision: "fp16"
  critic_local_files_only: True
  critic_freeze_backbones: True
  critic_device_map: "auto"
  critic_attn_implementation: "sdpa"
  critic_use_fast_processor: True
  use_seperate_critic_model: True
